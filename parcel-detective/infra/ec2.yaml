AWSTemplateFormatVersion: '2010-09-09'
Description: Parcel Detective private demo host. Creates billable EC2 and EBS resources. No inbound ports.
Parameters:
  SourceBucket:
    Type: String
    Description: Existing private S3 bucket containing the source ZIP, in this Region.
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  SourceKey:
    Type: String
    Default: Parcel-Detective-Reviewed.zip
    AllowedPattern: '[A-Za-z0-9._/-]+'
  InstanceType:
    Type: String
    Default: m7i.xlarge
    AllowedValues: [m7i.xlarge, m7i.2xlarge, m6i.xlarge, m6i.2xlarge]
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Gateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound access only; use Session Manager for the dashboard
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ParcelBedrockAndSource
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${SourceBucket}/${SourceKey}
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]
  Host:
    Type: AWS::EC2::Instance
    DependsOn: [InternetRoute, RouteAssociation]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 50, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: Parcel-Detective-Demo}
        - {Key: Project, Value: ParcelDetective}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y python3.12 python3.12-pip git unzip
          aws s3 cp 's3://${SourceBucket}/${SourceKey}' /tmp/parcel-source.zip --region '${AWS::Region}'
          unzip -q /tmp/parcel-source.zip -d /opt
          cat > /opt/parcel-detective/.env <<'ENV'
          PARCEL_MODE=aws
          AWS_REGION=${AWS::Region}
          BEDROCK_MODEL_ID=amazon.nova-lite-v1:0
          DECIDER_URL=http://127.0.0.1:8000
          DECIDER_MODEL=strands-decider-2B-qwen3.5-v1-2610
          ENV
          chown -R ec2-user:ec2-user /opt/parcel-detective
          sudo -u ec2-user bash /opt/parcel-detective/scripts/install_ec2.sh
Outputs:
  InstanceId:
    Value: !Ref Host
  Connection:
    Value: Use AWS Systems Manager Session Manager. No public web endpoint is configured.
  Reminder:
    Value: CREATE_COMPLETE means the infrastructure exists; preflight must pass before claiming deployment works.
